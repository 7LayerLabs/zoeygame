<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zoey's Runway</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  html,body { height:100%; overflow:hidden; font-family:'Arial Rounded MT Bold','Comic Sans MS',system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#ffd6ec 0%,#e7c6ff 50%,#c8e7ff 100%); }

  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:12px; }
  .screen.on { display:flex; }

  /* ---------- TITLE ---------- */
  #titleWord { font-size:clamp(40px,9vw,90px); letter-spacing:2px; text-align:center;
    background:linear-gradient(90deg,#ff2d95,#c13cff,#ff2d95,#8338ec,#ff2d95); background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 3.5s linear infinite;
    filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 8px 18px rgba(255,45,149,.5)); }
  @keyframes shimmer { to { background-position:300% 0; } }
  #titleSub { font-size:clamp(18px,4vw,34px); color:#8338ec; margin-top:6px; text-shadow:0 2px 0 #fff; }
  #titleArt { width:clamp(150px,42vw,240px); margin-top:14px; border-radius:22px; border:5px solid #fff; box-shadow:0 8px 24px rgba(90,24,154,.35); }
  #hud { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; justify-content:center; }
  .chip { display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.8); border-radius:30px; padding:8px 16px; font-size:clamp(14px,3vw,20px); color:#5a189a; box-shadow:0 4px 10px rgba(131,56,236,.2); }
  .chip svg { flex:0 0 auto; }
  #venueLine { margin-top:10px; font-size:clamp(15px,3.2vw,24px); color:#a4133c; text-shadow:0 1px 0 #fff; }
  .bigBtn { border:none; cursor:pointer; margin-top:26px; padding:20px 54px; font-size:clamp(24px,5vw,40px); font-family:inherit; color:#fff; background:linear-gradient(180deg,#ff5fa2,#ff2d95); border-radius:60px; box-shadow:0 8px 0 #c9126e,0 14px 24px rgba(0,0,0,.18); display:flex; align-items:center; gap:14px; }
  .bigBtn:active { transform:translateY(6px); box-shadow:0 2px 0 #c9126e; }
  #resetBtn { position:absolute; bottom:10px; right:14px; border:none; background:none; font-family:inherit; font-size:13px; color:rgba(90,24,154,.55); cursor:pointer; }
  #resetBtn.armed { color:#e63946; font-weight:bold; }

  /* ---------- THEME CARD ---------- */
  #themeCard { background:rgba(255,255,255,.92); border-radius:30px; padding:26px 34px; max-width:520px; width:92%; text-align:center; box-shadow:0 14px 34px rgba(131,56,236,.3); display:flex; flex-direction:column; align-items:center; gap:10px; }
  #themeKicker { font-size:clamp(14px,3vw,20px); letter-spacing:3px; color:#8338ec; }
  #themeIcon { width:clamp(70px,16vw,110px); height:clamp(70px,16vw,110px); border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(0,0,0,.18); }
  #themeIcon svg { width:60%; height:60%; }
  #themeName { font-size:clamp(30px,7vw,54px); color:#ff2d95; text-shadow:0 2px 0 #fff; }
  #themeLine { font-size:clamp(15px,3.4vw,22px); color:#5a189a; }
  #themeDots { display:flex; gap:8px; margin-top:4px; }
  #themeDots .dot { width:26px; height:26px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.2); }
  #themeGo { margin-top:14px; padding:14px 40px; font-size:clamp(20px,4.5vw,30px); }

  /* ---------- STUDIO ---------- */
  #screen-studio { justify-content:flex-start; gap:6px; }
  #studioTop { display:flex; align-items:center; gap:10px; margin-top:4px; flex-wrap:wrap; justify-content:center; }
  #tabs { display:flex; gap:8px; }
  .tab { border:none; font-family:inherit; display:flex; align-items:center; gap:8px; padding:10px 18px; font-size:clamp(14px,3vw,20px); border-radius:40px; background:rgba(255,255,255,.6); color:#8338ec; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .tab.on { background:linear-gradient(180deg,#ff5fa2,#ff2d95); color:#fff; }
  #themePill { display:flex; align-items:center; gap:8px; background:#5a189a; color:#ffd60a; border-radius:30px; padding:8px 16px; font-size:clamp(13px,2.8vw,18px); box-shadow:0 3px 8px rgba(0,0,0,.2); }
  #themePill .dot { width:14px; height:14px; border-radius:50%; border:2px solid #fff; }
  #clearAllBtn { display:flex; align-items:center; gap:6px; border:none; cursor:pointer; font-family:inherit; font-weight:bold; color:#fff; background:#e63946; border-radius:30px; padding:8px 14px; font-size:clamp(12px,2.6vw,16px); box-shadow:0 3px 8px rgba(0,0,0,.2); }
  #clearAllBtn:active { transform:scale(.94); }
  #faceWrap { flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; width:100%; }
  #studioDoll { filter:drop-shadow(0 10px 16px rgba(131,56,236,.25)); animation:idle 3.6s ease-in-out infinite; }
  .dollSlot { position:relative; overflow:hidden; }
  .dollSlot .dollScale { position:relative; height:100%; aspect-ratio:832/1248; }
  .dollSlot img.layer, .dollSlot svg.layer { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .dollSlot img.layer { object-fit:fill; }
  .dollSlot.full { width:100%; height:100%; display:flex; align-items:flex-end; justify-content:center; }
  .dollSlot.face { width:min(92vw,440px); height:100%; margin:0 auto; }
  .dollSlot.face .dollScale, .dollSlot.face.zoom-face .dollScale { position:absolute; height:175%; left:50%; top:0; transform:translateX(-50%); }
  .dollSlot.face.zoom-head .dollScale { height:150%; top:0; }
  .dollSlot.face.zoom-full .dollScale { height:100%; top:0; }
  .rowLabel .dollSlot { width:clamp(44px,8vw,68px); height:clamp(44px,8vw,68px); border-radius:50%; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15); }
  .rowLabel .dollSlot.face .dollScale { height:280%; top:-10%; }
  #magDoll { flex:1; width:70%; min-height:0; margin-top:4px; }
  .mk { position:absolute; pointer-events:none; border-radius:50%; }
  @keyframes idle { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  #palette { width:100%; max-width:820px; max-height:46vh; overflow-y:auto; background:rgba(255,255,255,.75); border-radius:26px; padding:12px 14px; box-shadow:0 8px 22px rgba(131,56,236,.18); }
  .palRow { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .palIcon { width:44px; height:44px; flex:0 0 44px; background:#fff; border-radius:14px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .sw { width:46px; height:46px; border-radius:50%; border:4px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.18); cursor:pointer; position:relative; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .sw:active { transform:scale(.9); }
  .sw.picked { border-color:#ffd60a; box-shadow:0 0 0 4px #ff2d95,0 3px 8px rgba(0,0,0,.2); }
  .sw.clear { background:#fff; }
  .sw.clear::after { content:""; position:absolute; left:8px; right:8px; top:50%; height:5px; background:#ccc; border-radius:3px; transform:rotate(-45deg); }
  .sw.locked { filter:grayscale(.75) brightness(.9); }
  .lockBadge { position:absolute; bottom:-8px; right:-8px; background:#5a189a; color:#ffd60a; border-radius:12px; font-size:11px; padding:2px 6px; display:flex; align-items:center; gap:3px; box-shadow:0 2px 5px rgba(0,0,0,.3); }
  .sw.shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  #runwayBtn { margin:10px 0 4px; padding:14px 44px; font-size:clamp(20px,4.5vw,32px); }

  /* ---------- RUNWAY ---------- */
  #screen-runway { background:linear-gradient(180deg,#2d1b4e 0%,#4a2a7a 55%,#1a0f33 100%); overflow:hidden; }
  #curtain { position:absolute; top:0; left:0; right:0; height:32%; background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.35)),repeating-linear-gradient(90deg,#a4133c 0 34px,#c9184a 34px 68px); border-bottom:10px solid #ffd60a; z-index:2; }
  .spot { position:absolute; top:0; width:26vw; height:70vh; background:radial-gradient(ellipse at top,rgba(255,255,220,.32),transparent 70%); clip-path:polygon(42% 0,58% 0,100% 100%,0 100%); pointer-events:none; z-index:3; }
  #floor { position:absolute; top:32%; bottom:0; left:0; right:0; background:linear-gradient(180deg,#3c2a63,#241645); }
  #catwalkEdge { position:absolute; top:32%; bottom:0; left:0; right:0; background:#ffd60a; clip-path:polygon(43% 0,57% 0,86% 100%,14% 100%); }
  #catwalkTop { position:absolute; top:32%; bottom:0; left:0; right:0; background:linear-gradient(180deg,#ff8fab 0%,#ff5fa2 60%,#ff2d95 100%); clip-path:polygon(44% 0,56% 0,83% 100%,17% 100%); }
  #catwalkTop::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(180deg, transparent 0 44px, rgba(255,255,255,.15) 44px 48px); }
  #skyline,#eiffel { position:absolute; top:0; left:0; right:0; height:31%; display:none; z-index:1; }
  #venueName { position:absolute; top:2%; width:100%; text-align:center; font-size:clamp(14px,3vw,22px); color:rgba(255,255,255,.85); letter-spacing:2px; z-index:4; }
  /* venue looks */
  .v-mall #curtain { background:linear-gradient(180deg,rgba(0,0,0,0) 60%,rgba(0,0,0,.15)),repeating-linear-gradient(90deg,#bfe3ff 0 46px,#e6f4ff 46px 92px); border-bottom-color:#8ecae6; }
  .v-mall #floor { background:linear-gradient(180deg,#cdb4db,#8e7cc3); }
  .v-city #curtain { background:linear-gradient(180deg,#d7ecff 40%,#8ecae6); border-bottom-color:#ffd60a; }
  .v-city #floor { background:linear-gradient(180deg,#6a4c93,#3d2a66); }
  .v-city #catwalkTop { background:linear-gradient(180deg,#ffd166 0%,#ff8fab 70%,#ff5fa2 100%); }
  .v-tv #curtain { background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.4)),repeating-linear-gradient(90deg,#f72585 0 30px,#7209b7 30px 60px,#4cc9f0 60px 90px); border-bottom-color:#4cc9f0; }
  .v-tv #floor { background:linear-gradient(180deg,#240046,#10002b); }
  .v-tv #catwalkTop { background:linear-gradient(180deg,#4cc9f0 0%,#7209b7 60%,#f72585 100%); }
  .v-ny #curtain { background:linear-gradient(180deg,#0b1030 60%,#1b1445); border-bottom-color:#ffd60a; }
  .v-ny #skyline { display:block; }
  .v-paris #curtain { background:linear-gradient(180deg,#141034 55%,#2a1a4d); border-bottom-color:#ffd60a; }
  .v-paris #eiffel { display:block; }
  #crowdL,#crowdR { position:absolute; bottom:-2px; width:24%; height:20%; z-index:6; }
  #crowdL { left:0; } #crowdR { right:0; }
  .flash { position:absolute; width:14px; height:14px; border-radius:50%; background:radial-gradient(#fff,rgba(255,255,255,0) 70%); box-shadow:0 0 18px 6px rgba(255,255,255,.75); animation:flash .45s ease-out forwards; z-index:7; pointer-events:none; }
  @keyframes flash { 0%{transform:scale(.3);opacity:1} 100%{transform:scale(2.4);opacity:0} }
  #walkerBox { position:absolute; bottom:-2vh; left:50%; height:64vh; transform:translate(-50%,-42vh) scale(.16); transform-origin:bottom center; transition:transform 3.4s cubic-bezier(.4,.1,.6,.9), opacity .35s; opacity:0; will-change:transform; z-index:5; }
  #walkerBox.snap { transition:none; }
  #walkerBox.visible { opacity:1; }
  #walkerBox.near { transform:translate(-50%,0) scale(1); }
  #walkerBox svg { height:100%; width:auto; }
  #walkerBox.strut svg { animation:bob .5s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-1.4deg)} 50%{transform:translateY(-10px) rotate(1.4deg)} }
  #walkerBox.pose svg { animation:twirl 1.5s ease-in-out; }
  @keyframes twirl {
    0%   { transform:scale(1) scaleX(1); }
    15%  { transform:scale(1.03) scaleX(.15); }
    30%  { transform:scale(1.05) scaleX(-1); }
    45%  { transform:scale(1.05) scaleX(.15); }
    60%  { transform:scale(1.07) scaleX(1); }
    80%  { transform:scale(1.09) rotate(-2.5deg); }
    100% { transform:scale(1) rotate(0); }
  }
  #walkerName { position:absolute; top:8%; width:100%; text-align:center; font-size:clamp(30px,7vw,60px); color:#ffd60a; text-shadow:0 3px 0 #a4133c,0 8px 18px rgba(0,0,0,.5); z-index:5; }

  /* ---------- RESULTS ---------- */
  #screen-results { justify-content:flex-start; gap:4px; padding-top:10px; background:linear-gradient(180deg,#8338ec,#ff5fa2); }
  #bubble { min-height:56px; max-width:640px; background:#fff; border-radius:22px; padding:10px 20px; font-size:clamp(15px,3.4vw,22px); color:#5a189a; box-shadow:0 6px 16px rgba(0,0,0,.15); text-align:center; display:flex; align-items:center; justify-content:center; }
  #judgeGrid { display:grid; grid-template-columns:minmax(64px,110px) repeat(3,minmax(70px,120px)) minmax(64px,110px); gap:6px 10px; align-items:center; justify-items:center; margin-top:6px; }
  .judgeCell svg { width:100%; max-width:110px; height:auto; }
  .judgeName { font-size:clamp(10px,2vw,14px); color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.4); text-align:center; margin-top:-6px; }
  .rowLabel { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:clamp(12px,2.4vw,17px); color:#5a189a; }
  .rowLabel svg { width:clamp(40px,7vw,64px); height:auto; border-radius:50%; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15); }
  .card { width:clamp(52px,9vw,84px); height:clamp(64px,11vw,104px); border-radius:14px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:clamp(30px,6vw,52px); color:#ff2d95; box-shadow:0 5px 12px rgba(0,0,0,.2); transform:scale(0) rotate(-180deg); transition:transform .45s cubic-bezier(.34,1.56,.64,1); }
  .card.blue { color:#3a86ff; }
  .card.flip { transform:scale(1) rotate(0deg); }
  .total { font-size:clamp(26px,5.5vw,46px); color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.25); opacity:0; transition:opacity .4s; display:flex; align-items:center; gap:4px; }
  .total.show { opacity:1; }
  #banner { font-size:clamp(34px,8vw,72px); color:#ffd60a; text-shadow:0 4px 0 #a4133c,0 10px 22px rgba(0,0,0,.4); opacity:0; transform:scale(.3); transition:all .5s cubic-bezier(.34,1.56,.64,1); margin-top:6px; text-align:center; }
  #banner.show { opacity:1; transform:scale(1); }
  #againBtn { margin-top:10px; padding:14px 40px; font-size:clamp(20px,4.5vw,30px); visibility:hidden; }

  /* ---------- MAGAZINE COVER ---------- */
  #cover { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; background:rgba(20,8,43,.75); z-index:60; }
  #cover.on { display:flex; }
  #mag { width:min(76vw,380px); max-height:78vh; aspect-ratio:3/4.1; background:linear-gradient(180deg,#fff 0%,#ffe9f4 100%); border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,.5); display:flex; flex-direction:column; align-items:center; padding:14px 10px 10px; position:relative; overflow:hidden; animation:magIn .6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes magIn { from { transform:scale(.2) rotate(-14deg); opacity:0; } }
  #magHead { font-size:clamp(34px,9vw,58px); letter-spacing:2px; background:linear-gradient(90deg,#ff2d95,#8338ec); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1; }
  #magSub { font-size:clamp(11px,2.4vw,15px); color:#8338ec; letter-spacing:2px; margin-top:2px; }
  #magSvg { flex:1; min-height:0; margin-top:4px; }
  #magBanner { position:absolute; bottom:52px; left:0; right:0; text-align:center; font-size:clamp(22px,5.5vw,34px); color:#fff; background:rgba(255,45,149,.92); padding:6px 0; transform:rotate(-3deg); box-shadow:0 4px 12px rgba(0,0,0,.25); }
  #magTag { position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:clamp(12px,2.8vw,17px); color:#5a189a; }
  #coverHint { color:#fff; font-size:clamp(13px,3vw,18px); text-shadow:0 2px 6px rgba(0,0,0,.6); animation:tw2 1.6s ease-in-out infinite; }
  @keyframes tw2 { 0%,100%{opacity:.5} 50%{opacity:1} }

  #confetti { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:50; }
  .conf { position:absolute; top:-20px; width:12px; height:18px; border-radius:3px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>

<!-- ============ SHARED ART: one doll, everything driven by CSS variables ============ -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="glitGrad"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#ffd60a"/></radialGradient>
    <radialGradient id="shade" cx="50%" cy="40%" r="65%"><stop offset="0%" stop-color="rgba(255,255,255,.25)"/><stop offset="70%" stop-color="rgba(255,255,255,0)"/><stop offset="100%" stop-color="rgba(120,60,20,.18)"/></radialGradient>
    <radialGradient id="gemGrad"><stop offset="0%" stop-color="#fff"/><stop offset="60%" stop-color="#7fd8ff"/><stop offset="100%" stop-color="#3a86ff"/></radialGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="rgba(255,255,255,.95)"/><stop offset="100%" stop-color="rgba(173,216,255,.55)"/></linearGradient>
    <linearGradient id="rbow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2d95"/><stop offset="22%" stop-color="#ff9505"/><stop offset="42%" stop-color="#ffd60a"/>
      <stop offset="62%" stop-color="#57cc99"/><stop offset="80%" stop-color="#3a86ff"/><stop offset="100%" stop-color="#8338ec"/>
    </linearGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>

    <pattern id="pat-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3.4" fill="#fff" opacity=".55"/>
    </pattern>
    <pattern id="pat-stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="16" fill="#fff" opacity=".35"/>
    </pattern>
    <pattern id="pat-stars" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M13,4 l2,5 5,.7 -3.6,3.4 .9,5 -4.3,-2.4 -4.3,2.4 .9,-5 -3.6,-3.4 5,-.7 Z" fill="#fff" opacity=".7"/>
      <circle cx="23" cy="21" r="1.4" fill="#fff" opacity=".8"/>
    </pattern>
    <pattern id="pat-tiedye" width="60" height="60" patternUnits="userSpaceOnUse">
      <g filter="url(#blur6)">
        <circle cx="14" cy="14" r="16" fill="#ff5fa2" opacity=".55"/>
        <circle cx="46" cy="18" r="15" fill="#ffd60a" opacity=".5"/>
        <circle cx="22" cy="46" r="15" fill="#2ec4b6" opacity=".5"/>
        <circle cx="50" cy="48" r="14" fill="#9b5de5" opacity=".5"/>
      </g>
    </pattern>
    <pattern id="pat-leo" width="34" height="34" patternUnits="userSpaceOnUse">
      <ellipse cx="10" cy="10" rx="6" ry="4.5" fill="#d4a373" opacity=".75"/>
      <path d="M4,6 Q2,10 5,13 M15,6 Q18,9 15,13" stroke="#6b3410" stroke-width="2.4" fill="none" opacity=".8" stroke-linecap="round"/>
      <ellipse cx="26" cy="25" rx="6" ry="4.5" fill="#d4a373" opacity=".75"/>
      <path d="M20,22 Q18,26 21,29 M31,21 Q34,25 31,29" stroke="#6b3410" stroke-width="2.4" fill="none" opacity=".8" stroke-linecap="round"/>
    </pattern>
    <pattern id="pat-sparkle" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M12,3 l1.6,4.4 4.4,1.6 -4.4,1.6 -1.6,4.4 -1.6,-4.4 -4.4,-1.6 4.4,-1.6 Z" fill="#ffd60a" opacity=".85"/>
      <circle cx="20" cy="19" r="1.3" fill="#fff" opacity=".9"/>
      <circle cx="4" cy="20" r="1" fill="#fff" opacity=".7"/>
    </pattern>
    <pattern id="pat-hearts" width="28" height="26" patternUnits="userSpaceOnUse">
      <path d="M14,22 C6,16 4,10 8,8 C11,6 14,9 14,11 C14,9 17,6 20,8 C24,10 22,16 14,22 Z" fill="#fff" opacity=".75"/>
    </pattern>
    <pattern id="pat-flowers" width="32" height="32" patternUnits="userSpaceOnUse">
      <g fill="#fff" opacity=".75">
        <circle cx="16" cy="10" r="3.4"/><circle cx="11" cy="14" r="3.4"/><circle cx="21" cy="14" r="3.4"/>
        <circle cx="13" cy="19" r="3.4"/><circle cx="19" cy="19" r="3.4"/>
      </g>
      <circle cx="16" cy="15" r="2.3" fill="#ffd60a"/>
    </pattern>

    <!-- ===== THE DOLL (instance look = CSS vars on the <use>) ===== -->
    <g id="doll">

    face.iris&&face.iris[0]||"", face.nails&&face.nails[0]||"",

function starPath(ctx, cx, cy, r){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=-Math.PI/2 + i*Math.PI/5;
    const rad=i%2===0 ? r : r*0.42;
    const x=cx+Math.cos(a)*rad, y=cy+Math.sin(a)*rad;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}
function heartPath(ctx, cx, cy, s){

  ctx.bezierCurveTo(cx-s*0.15, cy+s*0.1, cx-s*1.15, cy-s*0.05, cx-s*0.62, cy-s*0.48);
  ctx.bezierCurveTo(cx-s*0.28, cy-s*0.95, cx, cy-s*0.55, cx, cy-s*0.32);
  ctx.bezierCurveTo(cx, cy-s*0.55, cx+s*0.28, cy-s*0.95, cx+s*0.62, cy-s*0.48);
  ctx.bezierCurveTo(cx+s*1.15, cy-s*0.05, cx+s*0.15, cy+s*0.1, cx, cy+s*0.55);
  ctx.closePath();
}
function paintGem(ctx, cx, cy, s){
  ctx.beginPath();
  ctx.moveTo(cx, cy-s); ctx.lineTo(cx+s*0.72, cy); ctx.lineTo(cx, cy+s); ctx.lineTo(cx-s*0.72, cy);
  ctx.closePath();
  ctx.fillStyle="#3a86ff"; ctx.strokeStyle="#1d4e89"; ctx.lineWidth=1.5;
  ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, cy-s); ctx.lineTo(cx+s*0.72, cy); ctx.lineTo(cx, cy);
  ctx.closePath();
  ctx.fillStyle="#cfe8ff"; ctx.fill();
}
function paintDecals(ctx, face){

function tintImage(img, hex, mode, pattern, face){
  const key=img.src+"|"+(hex||"")+"|"+mode+"|"+(pattern||"")+"|"+faceKey(face);
  if(TINT.has(key)) return TINT.get(key);
  let g;
  try{ g=gpu(); }catch(e){ g=null; }
  if(!g) return img.src;
  const gl=g.gl, w=img.naturalWidth, h=img.naturalHeight;
  gl.canvas.width=w; gl.canvas.height=h;
  gl.viewport(0,0,w,h);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, g.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.clearColor(0,0,0,0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  const rainbow=String(hex||"").indexOf("url")===0;
  let tint=[1,1,1];
  if(!rainbow && hex && hex[0]==="#"){
    tint=[parseInt(hex.slice(1,3),16)/255, parseInt(hex.slice(3,5),16)/255, parseInt(hex.slice(5,7),16)/255];
  }
  gl.uniform3f(g.u.tint, tint[0], tint[1], tint[2]);
  gl.uniform1f(g.u.mode, mode==="skin"?1:0);
  gl.uniform1f(g.u.rainbow, rainbow?1:0);
  gl.uniform1f(g.u.pat, mode==="dress" ? (PAT_ID[pattern]||0) : 0);
  gl.uniform2f(g.u.size, w, h);
  const skin=mode==="skin" && face;
  const lip=skin && face.lips && face.lips[0];
  const shadow=skin && face.shadow && face.shadow[0];
  const blush=skin && face.blush && face.blush[0];
  const iris=skin && face.iris && face.iris[0] && String(face.iris[0]).toLowerCase()!=="#6b4423" && DOLL["face-iris"];
  gl.uniform1f(g.u.lipOn, lip?1:0);
  gl.uniform1f(g.u.shadowOn, shadow?1:0);
  gl.uniform1f(g.u.blushOn, blush?1:0);
  gl.uniform1f(g.u.irisOn, iris?1:0);
  gl.uniform1f(g.u.lipRain, lip && String(lip).indexOf("url")===0 ? 1 : 0);
  gl.uniform1f(g.u.shadowRain, shadow && String(shadow).indexOf("url")===0 ? 1 : 0);
  if(lip) setCol(gl, g.u.lip, lip);
  if(shadow) setCol(gl, g.u.shadow, shadow);
  if(blush) setCol(gl, g.u.blush, blush);
  if(iris){
    setCol(gl, g.u.iris, face.iris[0]);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, g.irisTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, DOLL["face-iris"]);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, g.tex);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  let url;
  if(skin && hasDecal(face)){
    const c=document.createElement("canvas");
    c.width=w; c.height=h;
    const ctx=c.getContext("2d");
    ctx.drawImage(gl.canvas, 0, 0);
    paintDecals(ctx, face);
    url=c.toDataURL("image/png");
  } else url=gl.canvas.toDataURL("image/png");
  TINT.set(key,url);
  return url;
}

let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function ding(freq=880){
  try{ const c=ac(),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=freq; o.type="sine"; g.gain.setValueAtTime(.3,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.5);
  }catch(e){}
}
function fanfare(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>ding(f),i*160)); }
function applause(dur=1.4){
  try{ const c=ac(),len=c.sampleRate*dur,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
    const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=buf; f.type="bandpass"; f.frequency.value=1200; f.Q.value=.6; g.gain.value=.5;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  }catch(e){}
}
function beat(times){
  for(let i=0;i<times;i++) setTimeout(()=>{
    try{ const c=ac(),o=c.createOscillator(),g=c.createGain();
      o.type="sine"; o.frequency.setValueAtTime(150,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(45,c.currentTime+.14);
      g.gain.setValueAtTime(.5,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.18);
    }catch(e){}
  }, i*420);
}

let VOICE=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  VOICE =
    vs.find(v=>/(aria|jenny|michelle|sonia|natasha|emma|ava).*(natural|online)/i.test(v.name)) ||
    vs.find(v=>/natural|online/i.test(v.name)&&/^en/i.test(v.lang)&&!/male|guy|davis|andrew|brian|christopher|eric|roger|steffan/i.test(v.name)) ||
    vs.find(v=>/google us english/i.test(v.name)) ||
    vs.find(v=>/female|zira|samantha|victoria|karen|moira|tessa/i.test(v.name)&&/^en/i.test(v.lang)) ||
    vs.find(v=>/^en/i.test(v.lang)) || null;
}
try{ speechSynthesis.onvoiceschanged=pickVoice; pickVoice(); }catch(e){}
function say(text){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(!VOICE) pickVoice();
    if(VOICE) u.voice=VOICE;
    u.pitch=1.1; u.rate=1.0;
    speechSynthesis.speak(u);
  }catch(e){}
}

  b.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="#ffd60a"><use href="#ic-lock"/></svg>'+cost;

}
function tryUnlock(sw,key,name){
  const k=lockKey(key,name), cost=LOCKED[k];
  if(S.stars>=cost){
    S.stars-=cost; S.unlocked.push(k); saveState();
    sw.classList.remove("locked"); sw.querySelector(".lockBadge").remove();
    fanfare(); confetti(); say("You unlocked the "+(ACCN[name]||name)+"!");
    refreshHud();
    return true;
  }
  sw.classList.add("shake"); setTimeout(()=>sw.classList.remove("shake"),450);
  ding(300); say("Win more shows to earn stars for that one!");
  return false;
}

function buildColorRow(rowId,key,cols,clearable){
  const box=document.querySelector("#"+rowId+" .swatches");
  if(clearable){
    const c=document.createElement("div");
    c.className="sw clear";
    c.onclick=()=>{ pickIn(c.closest(".palRow"),c); zoey[key]=null; refreshZoey(); ding(440); };
    SWREF[key+":"]=c;
    box.appendChild(c);
  }
  cols.forEach(col=>{
    const sw=document.createElement("div");
    sw.className="sw";
    sw.style.background = col[0].startsWith("url") ? "linear-gradient(135deg,#ff2d95,#ffd60a,#57cc99,#3a86ff,#8338ec)" : col[0];
    if(isLocked(key,col[1])) addLockBadge(sw,LOCKED[lockKey(key,col[1])]);
    sw.onclick=()=>{
      if(isLocked(key,col[1])){ tryUnlock(sw,key,col[1]); if(isLocked(key,col[1])) return; }
      pickIn(sw.closest(".palRow"),sw); zoey[key]=col; refreshZoey(); ding(700+Math.random()*400);
    };
    SWREF[key+":"+col[1]]=sw;
    box.appendChild(sw);
  });
}
function buildPatternRow(){
  const box=document.querySelector("#rowPat .swatches");
  const c=document.createElement("div");
  c.className="sw clear";
  c.onclick=()=>{ pickIn(c.closest(".palRow"),c); zoey.pat=null; refreshZoey(); ding(440); };
  SWREF["pat:"]=c;
  box.appendChild(c);
  PATTERNS.forEach(p=>{
    const sw=document.createElement("div");
    sw.className="sw"; sw.style.background="#ff8fab"; sw.style.overflow="hidden";
    sw.innerHTML='<svg width="38" height="38" viewBox="0 0 60 60" style="border-radius:50%"><rect width="60" height="60" fill="#ff8fab"/><rect width="60" height="60" fill="'+p[0].replace(/"/g,"")+'"/></svg>';
    if(isLocked("pat",p[2])) addLockBadge(sw,LOCKED[lockKey("pat",p[2])]);
    sw.onclick=()=>{
      if(isLocked("pat",p[2])){ tryUnlock(sw,"pat",p[2]); if(isLocked("pat",p[2])) return; }
      pickIn(sw.closest(".palRow"),sw); zoey.pat=p; refreshZoey(); ding(700+Math.random()*400);
    };
    SWREF["pat:"+p[2]]=sw;
    box.appendChild(sw);
  });
}
function buildShapes(){
  document.querySelectorAll(".shape-sw").forEach(sw=>{
    const key=sw.dataset.key, val=sw.dataset.val;
    SWREF[key+":"+val]=sw;
    sw.onclick=()=>{ pickIn(sw.closest(".palRow"),sw); zoey[key]=val; refreshZoey(); ding(760); };
  });
  // accessories: multi-select toggles
  document.querySelectorAll(".acc-sw").forEach(sw=>{
    const a=sw.dataset.acc;
    SWREF["acc:"+a]=sw;
    if(isLocked("acc",a)) addLockBadge(sw,LOCKED[lockKey("acc",a)]);
    sw.onclick=()=>{
      if(isLocked("acc",a)){ tryUnlock(sw,"acc",a); if(isLocked("acc",a)) return; }
      const i=zoey.accs.indexOf(a);
      if(i>=0){ zoey.accs.splice(i,1); sw.classList.remove("picked"); ding(440); }
      else{ zoey.accs.push(a); sw.classList.add("picked"); ding(1100); }
      refreshZoey();
    };
  });
  $("accClear").onclick=()=>{
    zoey.accs=[];
    document.querySelectorAll(".acc-sw").forEach(s=>s.classList.remove("picked"));
    refreshZoey(); ding(440);
  };
}
const TOGGLES=[["twGlit","glit"],["twLash","lash"],["twFrk","frk"],["twGem","gem"],["twHeart","hearts"],["twSticker","stickers"],["twWing","wing"],["twStreak","streak"]];
function buildToggles(){
  TOGGLES.forEach(([id,key])=>{
    const el=$(id);
    SWREF["tg:"+key]=el;
    el.onclick=()=>{ zoey[key]=!zoey[key]; el.classList.toggle("picked",zoey[key]); refreshZoey(); ding(zoey[key]?1200:500); };

}
function buildTabs(){
  const TABVIEW={ makeup:"pal-makeup", hair:"pal-hair", clothes:"pal-clothes" };
  const TABZOOM={ makeup:"zoom-face", hair:"zoom-head", clothes:"zoom-full" };
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");

function applyLookUI(){
  // re-highlight swatches to match the saved look
  const pickRef=(k)=>{ const el=SWREF[k]; if(el){ pickIn(el.closest(".palRow"),el); } };
  ["lips","shadow","blush","nails"].forEach(key=>pickRef(key+":"+(zoey[key]?zoey[key][1]:"")));
  pickRef("iris:"+zoey.iris[1]); pickRef("skin:"+zoey.skin[1]); pickRef("hairc:"+zoey.hairc[1]);
  pickRef("dress:"+zoey.dress[1]); pickRef("shoec:"+zoey.shoec[1]);
  pickRef("pat:"+(zoey.pat?zoey.pat[2]:""));
  pickRef("hair:"+zoey.hair); pickRef("style:"+zoey.style); pickRef("shoe:"+zoey.shoe);
  zoey.accs.forEach(a=>{ const el=SWREF["acc:"+a]; if(el) el.classList.add("picked"); });
  TOGGLES.forEach(([id,key])=>$(id).classList.toggle("picked",!!zoey[key]));
  refreshZoey();
}

// ---------- HUD ----------
function refreshHud(){
  const v=curVenue();
  $("chipRank").innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="#ffd60a"><use href="#ic-star"/></svg>'+(S.legend?"LEGEND":v.rank);
  $("chipStars").innerHTML=STAR+S.stars+" stars";
  $("chipTroph").innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="#ffb703"><use href="#ic-trophy"/></svg>'+S.trophies.length+" trophies";

// ---------- theme round ----------
function startRound(){
  let pool=THEMES.filter(t=>t.id!==S.lastTheme);
  theme=rand(pool); S.lastTheme=theme.id; saveState();
  $("themeIcon").style.background=theme.bg;
  $("themeIcon").innerHTML='<svg viewBox="0 0 24 24">'+theme.icon+'</svg>';
  $("themeName").textContent=theme.name;
  $("themeLine").textContent=theme.line;
  $("themeDots").innerHTML="";
  const hexOf={}; DRESSCOL.concat(COLORS.shadow,COLORS.blush).forEach(c=>{ if(!hexOf[c[1]]) hexOf[c[1]]=c[0]; });
  theme.cols.slice(0,5).forEach(n=>{
    const d=document.createElement("div"); d.className="dot"; d.style.background=hexOf[n]||"#fff"; $("themeDots").appendChild(d);
  });
  $("pillDot").style.background=theme.bg;
  $("pillName").textContent=theme.name;
  show("screen-theme");
  say("Today's challenge: "+theme.name+"! "+theme.line);
}
function themeMatches(L){
  const hits=[];
  if(L.dress&&theme.cols.includes(L.dress[1])) hits.push(["That "+L.dress[1]+" outfit is SO "+theme.name+"!"]);
  if(L.pat&&theme.pats.includes(L.pat[2])) hits.push(["The "+L.pat[1]+" pattern is PERFECT for "+theme.name+"!"]);
  if(theme.fits.includes(L.style)) hits.push(["A "+FITN[L.style]+"! Exactly right for "+theme.name+"!"]);
  if(theme.shoes.includes(L.shoe)) hits.push(["Those "+SHOEN[L.shoe]+" are just right for "+theme.name+"!"]);
  L.accs.forEach(a=>{ if(theme.accs.includes(a)) hits.push(["The "+ACCN[a]+" totally says "+theme.name+"!"]); });
  if(L.hairc&&theme.cols.includes(L.hairc[1])) hits.push(["Even the "+L.hairc[1]+" hair matches "+theme.name+"!"]);
  return hits.slice(0,4);
}

// ---------- rival look ----------
function cpuStyle(){
  const v=curVenue();
  rival=RIVALS[rand(v.rivals)];
  const silly=Math.random()<rival.silly;
  cpu={ skin:[rival.skin,""], iris:[rival.iris,""], hair:rival.hair, hairc:rival.hairc, streak:false,
    lips:rand(COLORS.lips), shadow:rand(COLORS.shadow), blush:rand(COLORS.blush), nails:null,
    glit:Math.random()<.5, lash:Math.random()<.4, frk:false, gem:Math.random()<.25,
    style:rival.style, pat:Math.random()<.45?rand(PATTERNS):null,
    dress:rival.dress, shoe:rival.shoe, shoec:rand(SHOECOL), accs:[], silly };
  if(silly){
    cpu.lips=[["#8fe388","green"],["#3a86ff","blue"],["#ffd166","yellow"]][ri(0,2)];
    cpu.dress=[["#8fe388","green"],["#ff7f50","orange"]][ri(0,1)];
    cpu.pat=rand(PATTERNS);
    cpu.accs=[rand(["hat","sunglasses","bow"])];
  }else{
    // rivals sometimes play the theme too, so it feels like a real contest
    if(Math.random()<.5){ const tc=theme.cols[0]; const found=DRESSCOL.find(c=>c[1]===tc); if(found) cpu.dress=found; }
    if(Math.random()<.4&&theme.fits.length) cpu.style=theme.fits[0];
    cpu.accs=[rand(["","tiara","bow","earrings","necklace"])].filter(Boolean);

}

// ---------- runway ----------
function flashes(n){
  const scr=$("screen-runway");
  for(let i=0;i<n;i++) setTimeout(()=>{
    if(!scr.classList.contains("on")) return;
    const f=document.createElement("div");
    f.className="flash";
    f.style.left=(4+Math.random()*18 + (Math.random()<.5?0:74))+"%";
    f.style.bottom=(2+Math.random()*20)+"%";
    scr.appendChild(f);
    setTimeout(()=>f.remove(),520);
  }, i*420+Math.random()*220);
}
async function runway(){
  const v=curVenue();
  const scr=$("screen-runway");
  scr.className="screen on";
  scr.classList.add(v.cls);
  $("venueName").textContent=v.name.toUpperCase();
  cpuStyle();
  say("Welcome to "+v.name+"!");
  await wait(600);
  await walkDoll(zoey,"Zoey");
  await walkDoll(cpu,rival.name);
  results();
}
async function walkDoll(look,name){
  const box=$("walkerBox");
  $("walkerName").textContent=name;
  renderDoll($("walkerDoll"), look, "");
  box.classList.add("snap");
  box.classList.remove("near","pose","strut","visible");
  void box.offsetWidth;
  box.classList.remove("snap");
  box.classList.add("visible","strut");
  beat(8); flashes(9); box.classList.add("near");
  await wait(3400);
  box.classList.remove("strut"); box.classList.add("pose");   // twirl + pose up front
  applause(); flashes(5); if(name==="Zoey") say("Go Zoey, go!");
  await wait(1700);
  box.classList.remove("pose"); box.classList.add("strut");
  beat(6); flashes(6); box.classList.remove("near");
  await wait(2400);
  box.classList.remove("strut","visible");
  await wait(350);
}

// ---------- judging ----------
// ponytail: rigged scoring on purpose — Zoey wins most rounds and never scores under 7. She's five.
function makeScores(zb,cb){
  const zoeyWins=Math.random()<curVenue().winP;
  const z=[ri(7,10),ri(7,10),ri(8,10)];
  let c;
  if(zoeyWins){ c=z.map(s=>Math.max(2,s-ri(1,4))); }
  else{ c=z.map(s=>Math.min(10,s+1)); c[0]=Math.min(10,c[0]+1); }
  // keep the theme bonuses from flipping the decided result
  let guard=20;
  while(guard--&&zoeyWins&&(z[0]+z[1]+z[2]+zb)<=(c[0]+c[1]+c[2]+cb)){
    const i=[0,1,2].find(i=>c[i]>2); if(i===undefined) break; c[i]--;
  }
  guard=20;
  while(guard--&&!zoeyWins&&(c[0]+c[1]+c[2]+cb)<=(z[0]+z[1]+z[2]+zb)){
    const i=[0,1,2].find(i=>c[i]<10); if(i===undefined) break; c[i]++;
  }
  return {z,c,zoeyWins};
}
function compliments(themeLines){
  const pool=[];
  if(zoey.lips)   pool.push("I LOVE the "+zoey.lips[1]+" lips!");
  if(zoey.shadow) pool.push("That "+zoey.shadow[1]+" eyeshadow sparkles!");
  if(zoey.blush)  pool.push("Gorgeous "+zoey.blush[1]+" cheeks!");
  if(zoey.nails)  pool.push(zoey.nails[1]+" nails! So fancy!");
  if(zoey.dress)  pool.push("That "+zoey.dress[1]+" "+FITN[zoey.style]+" is STUNNING!");
  if(zoey.pat)    pool.push("The "+zoey.pat[1]+" pattern is EVERYTHING!");
  pool.push("Those "+SHOEN[zoey.shoe]+"! Where can I get them?");
  zoey.accs.forEach(a=>pool.push("The "+ACCN[a]+"! Adorable!"));
  if(zoey.hairc)  pool.push("The "+zoey.hairc[1]+" hair is EVERYTHING!");
  const hairLines={pigtails:"Pigtails! Adorable!",curly:"Those curls! Iconic!",bun:"That bun is pure elegance!",braid:"That braid is beautiful!",pony:"Love the ponytail swish!",bob:"That bob is so cute!",spacebuns:"Space buns! Out of this world!"};
  if(zoey.hearts) pool.push("Heart cheeks! I love them!");
  if(zoey.stickers) pool.push("Gold stars on your cheeks!");
  if(zoey.wing) pool.push("That cat-eye liner! Fierce!");
  if(hairLines[zoey.hair]) pool.push(hairLines[zoey.hair]);
  if(zoey.glit)   pool.push("SO much glitter. Fabulous!");
  if(zoey.frk)    pool.push("Those cute freckles!");
  if(zoey.gem)    pool.push("Face gems! A true artist!");
  pool.sort(()=>Math.random()-.5);
  const out=themeLines.slice(0,2).map(h=>h[0]);
  while(out.length<3&&pool.length) out.push(pool.pop());
  while(out.length<3) out.push(rand(["Such natural beauty, darling!","What a superstar smile!","The walk! The confidence! Wow!"]));
  return out;
}
const CPU_LINES=[
  "Hmm... interesting choice.",
  "Did a clown help you get dressed today?",
  "Beep boop... needs more practice!",
  "Oh my. Bold. Very bold.",
];
async function results(){
  show("screen-results");
  ["zc0","zc1","zc2","cc0","cc1","cc2"].forEach(id=>{ $(id).classList.remove("flip"); $(id).textContent=""; });
  $("ztot").classList.remove("show"); $("ctot").classList.remove("show");
  $("banner").classList.remove("show"); $("againBtn").style.visibility="hidden";
  renderDoll($("lblZ"), zoey, "face");
  renderDoll($("lblC"), cpu, "face");
  $("lblCName").textContent=rival.name;
  $("bubble").textContent="The judges are ready...";
  say("Judges, what do we think of Zoey?");
  await wait(1800);

  const themeLines=themeMatches(zoey);
  const zb=themeLines.length;
  const cb=Math.min(2,themeMatches(cpu).length);
  const {z,c,zoeyWins}=makeScores(zb,cb);
  const nice=compliments(themeLines);
  for(let i=0;i<3;i++){
    $("bubble").textContent=nice[i]; say(nice[i]);
    $("zc"+i).textContent=z[i]; $("zc"+i).classList.add("flip"); ding(900+i*150);
    await wait(2100);
  }
  let ztotal=z[0]+z[1]+z[2];
  $("ztot").innerHTML=ztotal; $("ztot").classList.add("show");
  if(zb>0){
    await wait(900);
    const bline="Theme bonus! "+zb+" extra point"+(zb>1?"s":"")+" for nailing "+theme.name+"!";
    $("bubble").textContent=bline; say(bline); fanfare();
    ztotal+=zb;
    $("ztot").innerHTML=ztotal+STAR;
  }
  applause(1);
  await wait(1400);

  const cline=cpu.silly?CPU_LINES[ri(0,3)]:"Not bad, "+rival.name+"... not bad.";
  $("bubble").textContent=cline; say(cline);
  for(let i=0;i<3;i++){ $("cc"+i).textContent=c[i]; $("cc"+i).classList.add("flip"); ding(500+i*100); await wait(700); }
  $("ctot").textContent=c[0]+c[1]+c[2]+cb; $("ctot").classList.add("show");
  await wait(1200);

  if(zoeyWins){
    $("banner").textContent="ZOEY WINS!";
    $("banner").classList.add("show");
    fanfare(); applause(2.4); confetti();
    // career progress
    S.stars += 3 + (zb>=2?1:0);
    S.wins++;
    let advanced=false, oldName=curVenue().name;
    if(!S.legend && S.wins>=curVenue().need){
      S.trophies.push(oldName); S.wins=0;
      if(S.venue<VENUES.length-1){ S.venue++; advanced=true; }
      else { S.legend=true; }
    }
    saveState();
    if(S.legend&&!advanced&&S.trophies.length===VENUES.length){
      say("Zoey wins! You are a fashion LEGEND!");
    }else if(advanced){
      say("Zoey wins! Next stop: "+curVenue().name+"!");
    }else{
      say("Zoey wins! What a superstar!");
    }
    await wait(1300);
    showCover(advanced);
  }else{
    $("banner").textContent="Sooo close!";
    $("banner").classList.add("show");
    say("Ooh, so close! One more walk, Zoey!");
    $("againBtn").style.visibility="visible";
  }
}

  $("magBanner").textContent="ZOEY WINS!";
  $("magTag").textContent = advanced ? "Next stop: "+curVenue().name+"!" : theme.name+" Champion — "+curVenue().name;

$("cover").onclick=()=>{
  $("cover").classList.remove("on");

};

// ---------- confetti ----------
function confetti(){
  const layer=$("confetti"), colors=["#ff2d95","#ffd60a","#3a86ff","#8fe388","#9b5de5","#ff7f50"];
  for(let i=0;i<90;i++){
    const p=document.createElement("div");
    p.className="conf";
    p.style.left=Math.random()*100+"vw";
    p.style.background=rand(colors);
    p.style.animationDuration=(2.2+Math.random()*2)+"s";
    p.style.animationDelay=(Math.random()*1.2)+"s";

  }

}
