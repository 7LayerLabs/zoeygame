<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zoey's Runway</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  html,body { height:100%; overflow:hidden; font-family:'Arial Rounded MT Bold','Comic Sans MS',system-ui,sans-serif; }
  body { background:linear-gradient(160deg,#ffd6ec 0%,#e7c6ff 50%,#c8e7ff 100%); }

  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:12px; }
  .screen.on { display:flex; }

  /* ---------- TITLE ---------- */
  #titleWord { font-size:clamp(40px,9vw,90px); letter-spacing:2px; text-align:center;
    background:linear-gradient(90deg,#ff2d95,#c13cff,#ff2d95,#8338ec,#ff2d95); background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 3.5s linear infinite;
    filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 8px 18px rgba(255,45,149,.5)); }
  @keyframes shimmer { to { background-position:300% 0; } }
  #titleSub { font-size:clamp(18px,4vw,34px); color:#8338ec; margin-top:6px; text-shadow:0 2px 0 #fff; }
  .bigBtn { border:none; cursor:pointer; margin-top:34px; padding:20px 54px; font-size:clamp(24px,5vw,40px); font-family:inherit; color:#fff; background:linear-gradient(180deg,#ff5fa2,#ff2d95); border-radius:60px; box-shadow:0 8px 0 #c9126e,0 14px 24px rgba(0,0,0,.18); display:flex; align-items:center; gap:14px; }
  .bigBtn:active { transform:translateY(6px); box-shadow:0 2px 0 #c9126e; }
  .sparkle { position:absolute; width:26px; height:26px; animation:tw 1.6s ease-in-out infinite; pointer-events:none; }
  @keyframes tw { 0%,100%{transform:scale(.4);opacity:.3} 50%{transform:scale(1.15);opacity:1} }

  /* ---------- STUDIO ---------- */
  #screen-studio { justify-content:flex-start; gap:6px; }
  #studioTop { display:flex; align-items:center; gap:14px; margin-top:4px; flex-wrap:wrap; justify-content:center; }
  #tabs { display:flex; gap:8px; }
  .tab { border:none; font-family:inherit; display:flex; align-items:center; gap:8px; padding:10px 18px; font-size:clamp(14px,3vw,20px); border-radius:40px; background:rgba(255,255,255,.6); color:#8338ec; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .tab.on { background:linear-gradient(180deg,#ff5fa2,#ff2d95); color:#fff; }
  .sw { display:flex; align-items:center; justify-content:center; }
  .screenTitle { font-size:clamp(20px,4.5vw,34px); color:#ff2d95; text-shadow:0 2px 0 #fff; }
  #faceWrap { flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; width:100%; }
  #faceWrap svg { height:100%; max-height:44vh; width:auto; filter:drop-shadow(0 10px 16px rgba(131,56,236,.25)); }
  #palette { width:100%; max-width:800px; max-height:46vh; overflow-y:auto; background:rgba(255,255,255,.75); border-radius:26px; padding:12px 14px; box-shadow:0 8px 22px rgba(131,56,236,.18); }
  .palRow { display:flex; align-items:center; gap:8px; padding:6px 0; }
  .palIcon { width:44px; height:44px; flex:0 0 44px; background:#fff; border-radius:14px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; }
  .sw { width:46px; height:46px; border-radius:50%; border:4px solid #fff; box-shadow:0 3px 8px rgba(0,0,0,.18); cursor:pointer; position:relative; flex:0 0 auto; }
  .sw:active { transform:scale(.9); }
  .sw.picked { border-color:#ffd60a; box-shadow:0 0 0 4px #ff2d95,0 3px 8px rgba(0,0,0,.2); }
  .sw.clear { background:#fff; }
  .sw.clear::after { content:""; position:absolute; left:8px; right:8px; top:50%; height:5px; background:#ccc; border-radius:3px; transform:rotate(-45deg); }
  #glitBtn { width:auto; min-width:52px; padding:0 16px; border-radius:26px; height:52px; background:linear-gradient(135deg,#fff3b0,#ffd60a); display:flex; align-items:center; justify-content:center; }
  #glitBtn.picked { border-color:#ff2d95; }
  #runwayBtn { margin:10px 0 4px; padding:14px 44px; font-size:clamp(20px,4.5vw,32px); }

  /* ---------- RUNWAY ---------- */
  #screen-runway { background:linear-gradient(180deg,#2d1b4e 0%,#4a2a7a 55%,#1a0f33 100%); overflow:hidden; }
  #curtain { position:absolute; top:0; left:0; right:0; height:32%; background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.35)),repeating-linear-gradient(90deg,#a4133c 0 34px,#c9184a 34px 68px); border-bottom:10px solid #ffd60a; }
  .spot { position:absolute; top:0; width:26vw; height:70vh; background:radial-gradient(ellipse at top,rgba(255,255,220,.32),transparent 70%); clip-path:polygon(42% 0,58% 0,100% 100%,0 100%); pointer-events:none; }
  /* catwalk comes straight at the camera */
  #floor { position:absolute; top:32%; bottom:0; left:0; right:0; background:linear-gradient(180deg,#3c2a63,#241645); }
  #catwalkEdge { position:absolute; top:32%; bottom:0; left:0; right:0; background:#ffd60a; clip-path:polygon(43% 0,57% 0,86% 100%,14% 100%); }
  #catwalkTop { position:absolute; top:32%; bottom:0; left:0; right:0; background:linear-gradient(180deg,#ff8fab 0%,#ff5fa2 60%,#ff2d95 100%); clip-path:polygon(44% 0,56% 0,83% 100%,17% 100%); }
  #catwalkTop::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(180deg, transparent 0 44px, rgba(255,255,255,.15) 44px 48px); }
  #crowdL,#crowdR { position:absolute; bottom:-2px; width:24%; height:20%; z-index:6; }
  #crowdL { left:0; } #crowdR { right:0; }
  .flash { position:absolute; width:14px; height:14px; border-radius:50%; background:radial-gradient(#fff,rgba(255,255,255,0) 70%); box-shadow:0 0 18px 6px rgba(255,255,255,.75); animation:flash .45s ease-out forwards; z-index:7; pointer-events:none; }
  @keyframes flash { 0%{transform:scale(.3);opacity:1} 100%{transform:scale(2.4);opacity:0} }
  #walkerBox { position:absolute; bottom:-2vh; left:50%; height:64vh; transform:translate(-50%,-42vh) scale(.16); transform-origin:bottom center; transition:transform 3.4s cubic-bezier(.4,.1,.6,.9), opacity .35s; opacity:0; will-change:transform; z-index:5; }
  #walkerBox.snap { transition:none; }
  #walkerBox.visible { opacity:1; }
  #walkerBox.near { transform:translate(-50%,0) scale(1); }
  #walkerBox svg { height:100%; width:auto; }
  #walkerBox.strut svg { animation:bob .5s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-1.4deg)} 50%{transform:translateY(-10px) rotate(1.4deg)} }
  #walkerBox.pose svg { animation:pose 1.1s ease-in-out; }
  @keyframes pose { 0%{transform:scale(1)} 40%{transform:scale(1.09) rotate(-3deg)} 100%{transform:scale(1)} }
  #walkerName { position:absolute; top:8%; width:100%; text-align:center; font-size:clamp(30px,7vw,60px); color:#ffd60a; text-shadow:0 3px 0 #a4133c,0 8px 18px rgba(0,0,0,.5); z-index:5; }

  /* ---------- RESULTS ---------- */
  #screen-results { justify-content:flex-start; gap:4px; padding-top:10px; }
  #bubble { min-height:56px; max-width:640px; background:#fff; border-radius:22px; padding:10px 20px; font-size:clamp(15px,3.4vw,22px); color:#5a189a; box-shadow:0 6px 16px rgba(0,0,0,.15); text-align:center; display:flex; align-items:center; justify-content:center; }
  #judgeGrid { display:grid; grid-template-columns:minmax(64px,110px) repeat(3,minmax(70px,120px)) minmax(64px,110px); gap:6px 10px; align-items:center; justify-items:center; margin-top:6px; }
  .judgeCell svg { width:100%; max-width:110px; height:auto; }
  .judgeName { font-size:clamp(10px,2vw,14px); color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.4); text-align:center; margin-top:-6px; }
  .rowLabel { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:clamp(12px,2.4vw,17px); color:#5a189a; }
  .rowLabel svg { width:clamp(40px,7vw,64px); height:auto; border-radius:50%; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15); }
  .card { width:clamp(52px,9vw,84px); height:clamp(64px,11vw,104px); border-radius:14px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:clamp(30px,6vw,52px); color:#ff2d95; box-shadow:0 5px 12px rgba(0,0,0,.2); transform:scale(0) rotate(-180deg); transition:transform .45s cubic-bezier(.34,1.56,.64,1); }
  .card.blue { color:#3a86ff; }
  .card.flip { transform:scale(1) rotate(0deg); }
  .total { font-size:clamp(26px,5.5vw,46px); color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.25); opacity:0; transition:opacity .4s; }
  .total.show { opacity:1; }
  #screen-results { background:linear-gradient(180deg,#8338ec,#ff5fa2); }
  #banner { font-size:clamp(34px,8vw,72px); color:#ffd60a; text-shadow:0 4px 0 #a4133c,0 10px 22px rgba(0,0,0,.4); opacity:0; transform:scale(.3); transition:all .5s cubic-bezier(.34,1.56,.64,1); margin-top:6px; text-align:center; }
  #banner.show { opacity:1; transform:scale(1); }
  #againBtn { margin-top:10px; padding:14px 40px; font-size:clamp(20px,4.5vw,30px); visibility:hidden; }

  #confetti { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:50; }
  .conf { position:absolute; top:-20px; width:12px; height:18px; border-radius:3px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
</style>
</head>

<script>
"use strict";

// ---------- state ----------
const zoey = { lips:null, shadow:null, blush:null, glit:false, style:"aline", dress:null, shoe:null, acc:"", hair:"long", hairc:null };
const cpu  = { lips:null, shadow:null, blush:null, glit:false, style:"aline", dress:null, shoe:null, acc:"", hair:"long", hairc:null };

const COLORS = {
  lips:   [["#e63946","red"],["#ff5fa2","pink"],["#e0218a","hot pink"],["#9b5de5","purple"],["#ff7f50","coral"],["#ff9505","orange"],["#ffb703","gold"],["#3a86ff","blue"],["#2ec4b6","teal"],["#57cc99","green"],["#e9ecef","silver"],["#2d2d2d","black"]],
  shadow: [["#ff9ecb","pink"],["#f72585","hot pink"],["#b388eb","purple"],["#cdb4db","lavender"],["#7fd8ff","blue"],["#2ec4b6","teal"],["#8fe388","green"],["#b5e48c","lime"],["#ffd166","gold"],["#ff9e40","orange"],["#ff4d6d","red"],["#ced4da","silver"],["#212529","black"]],
  blush:  [["#ff8fa3","pink"],["#ff69b4","hot pink"],["#ffb07c","peach"],["#ff9770","coral"],["#e5989b","rose"],["#f08080","red"],["#c77dff","violet"],["#d4a373","bronze"]]
};
const DRESSCOL = [["#ff2d95","pink"],["#f72585","hot pink"],["#8338ec","purple"],["#cdb4db","lavender"],["#3a86ff","blue"],["#2ec4b6","teal"],["#57cc99","green"],["#ffd166","gold"],["#ff9505","orange"],["#e63946","red"],["#f8f9fa","white"],["#212529","black"]];
const SHOECOL  = [["#ffd60a","gold"],["#ced4da","silver"],["#ff5fa2","pink"],["#9b5de5","purple"],["#3a86ff","blue"],["#e63946","red"],["#f8f9fa","white"],["#212529","black"]];
const STYLES   = ["aline","gown","party","twopiece"];
const HAIRCOL  = [["#6b3410","brown"],["#2b2118","black"],["#f4c95d","blonde"],["#c1440e","red"],["#ff5fa2","pink"],["#e0218a","hot pink"],["#8338ec","purple"],["#3a86ff","blue"],["#2ec4b6","teal"],["#57cc99","green"],["#ff9505","orange"],["#ced4da","silver"]];
const HAIRSTYLES = ["long","pigtails","curly","bun"];

function $(id){ return document.getElementById(id); }
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $(id).classList.add("on"); }
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function ri(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ---------- sound (WebAudio, made on first tap) ----------
let AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function ding(freq=880){
  try{ const c=ac(),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=freq; o.type="sine"; g.gain.setValueAtTime(.3,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.5);
  }catch(e){}
}
function fanfare(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>ding(f),i*160)); }
function applause(dur=1.4){
  try{ const c=ac(),len=c.sampleRate*dur,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
    const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=buf; f.type="bandpass"; f.frequency.value=1200; f.Q.value=.6; g.gain.value=.5;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  }catch(e){}
}
function beat(times){ // simple catwalk kick while strutting
  for(let i=0;i<times;i++) setTimeout(()=>{
    try{ const c=ac(),o=c.createOscillator(),g=c.createGain();
      o.type="sine"; o.frequency.setValueAtTime(150,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(45,c.currentTime+.14);
      g.gain.setValueAtTime(.5,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.16);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.18);
    }catch(e){}
  }, i*420);
}

// ---------- speech (judges talk out loud) ----------
// Pick the most natural female English voice installed. Edge's "Natural"
// neural voices sound the most human; Chrome falls back to Google US English.
let VOICE=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  VOICE =
    vs.find(v=>/(aria|jenny|michelle|sonia|natasha|emma|ava).*(natural|online)/i.test(v.name)) ||
    vs.find(v=>/natural|online/i.test(v.name)&&/^en/i.test(v.lang)&&!/male|guy|davis|andrew|brian|christopher|eric|roger|steffan/i.test(v.name)) ||
    vs.find(v=>/google us english/i.test(v.name)) ||
    vs.find(v=>/female|zira|samantha|victoria|karen|moira|tessa/i.test(v.name)&&/^en/i.test(v.lang)) ||
    vs.find(v=>/^en/i.test(v.lang)) || null;
}
try{ speechSynthesis.onvoiceschanged=pickVoice; pickVoice(); }catch(e){}
function say(text){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(!VOICE) pickVoice();
    if(VOICE) u.voice=VOICE;
    u.pitch=1.1; u.rate=1.0;
    speechSynthesis.speak(u);
  }catch(e){}
}

// ---------- makeup studio ----------
function setVar(prefix, part, val){
  const map={lips:"-lips", shadow:"-shadow", blush:"-blush", dress:"-dress", shoe:"-shoe"};
  document.documentElement.style.setProperty("--"+prefix+map[part], val||"transparent");
}
function setOutfit(p, style){ document.querySelectorAll("."+p+"-outfit").forEach(g=>g.style.display = g.dataset.style===style?"block":"none"); }
function setAcc(p, acc){ document.querySelectorAll("."+p+"-acc").forEach(g=>g.style.display = g.dataset.acc===acc?"block":"none"); }
function setHair(p, style){
  document.querySelectorAll("."+p+"-hairback, ."+p+"-hairfront").forEach(g=>g.style.display = g.dataset.hair===style?"block":"none");
}
function buildSwatches(){
  document.querySelectorAll("#palette .palRow[data-part]").forEach(row=>{
    const part=row.dataset.part, box=row.querySelector(".swatches");
    const clear=document.createElement("div");
    clear.className="sw clear";
    clear.onclick=()=>{ pick(row,clear); zoey[part]=null; setVar("z",part,null); ding(440); };
    box.appendChild(clear);
    COLORS[part].forEach(([hex,name])=>{
      const sw=document.createElement("div");
      sw.className="sw"; sw.style.background=hex;
      sw.onclick=()=>{ pick(row,sw); zoey[part]=[hex,name]; setVar("z",part,hex); ding(700+Math.random()*400); };
      box.appendChild(sw);
    });
  });
  $("glitBtn").onclick=()=>{
    zoey.glit=!zoey.glit;
    $("glitBtn").classList.toggle("picked",zoey.glit);
    document.documentElement.style.setProperty("--z-glit",zoey.glit?1:0);
    ding(zoey.glit?1200:500);
  };
}
function pick(row,el){ row.querySelectorAll(".sw").forEach(s=>s.classList.remove("picked")); el.classList.add("picked"); }

function buildClothes(){
  document.querySelectorAll(".style-sw").forEach(b=>b.onclick=()=>{
    pick(b.closest(".palRow"),b); zoey.style=b.dataset.style; setOutfit("z",zoey.style); ding(750);
  });
  const dbox=document.querySelector("#rowDress .swatches");
  DRESSCOL.forEach(([hex,name])=>{
    const sw=document.createElement("div");
    sw.className="sw"; sw.style.background=hex;
    sw.onclick=()=>{ pick(sw.closest(".palRow"),sw); zoey.dress=[hex,name]; setVar("z","dress",hex); ding(700+Math.random()*400); };
    dbox.appendChild(sw);
  });
  const sbox=document.querySelector("#rowShoe .swatches");
  SHOECOL.forEach(([hex,name])=>{
    const sw=document.createElement("div");
    sw.className="sw"; sw.style.background=hex;
    sw.onclick=()=>{ pick(sw.closest(".palRow"),sw); zoey.shoe=[hex,name]; setVar("z","shoe",hex); ding(700+Math.random()*400); };
    sbox.appendChild(sw);
  });
  document.querySelectorAll(".acc-sw").forEach(b=>b.onclick=()=>{
    pick(b.closest(".palRow"),b); zoey.acc=b.dataset.acc; setAcc("z",zoey.acc); ding(zoey.acc?1100:440);
  });
  const TABVIEW = { makeup:["pal-makeup","30 2 160 160"], hair:["pal-hair","22 0 176 205"], clothes:["pal-clothes","15 0 190 415"] };
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
    for(const k in TABVIEW) $(TABVIEW[k][0]).style.display = k===t.dataset.tab ? "block" : "none";
    $("studioSvg").setAttribute("viewBox", TABVIEW[t.dataset.tab][1]);
    ding(700);
  });
}

function buildHair(){
  document.querySelectorAll(".hair-sw").forEach(b=>b.onclick=()=>{
    pick(b.closest(".palRow"),b); zoey.hair=b.dataset.hair; setHair("z",zoey.hair); ding(780);
  });
  const hbox=document.querySelector("#rowHairCol .swatches");
  HAIRCOL.forEach(([hex,name])=>{
    const sw=document.createElement("div");
    sw.className="sw"; sw.style.background=hex;
    sw.onclick=()=>{ pick(sw.closest(".palRow"),sw); zoey.hairc=[hex,name]; document.documentElement.style.setProperty("--z-hairc",hex); ding(700+Math.random()*400); };
    hbox.appendChild(sw);
  });
}

// ---------- computer rival look ----------
function cpuStyle(){
  // 40% of rounds Robo-Bella goes full silly (clashing everything)
  const silly=Math.random()<.4;
  cpu.lips  = silly ? [["#8fe388","green"],["#3a86ff","blue"],["#ffd166","yellow"]][ri(0,2)] : rand(COLORS.lips);
  cpu.shadow= rand(COLORS.shadow);
  cpu.blush = rand(COLORS.blush);
  cpu.glit  = Math.random()<.5;
  cpu.style = rand(STYLES);
  cpu.dress = silly ? [["#8fe388","green"],["#ff7f50","orange"]][ri(0,1)] : rand(DRESSCOL);
  cpu.shoe  = rand(SHOECOL);
  cpu.acc   = rand(["","tiara","bow","earrings"]);
  cpu.hair  = rand(HAIRSTYLES);
  cpu.hairc = silly ? [["#8fe388","green"],["#ff7f50","orange"]][ri(0,1)] : rand(HAIRCOL);
  cpu.silly = silly;
  setVar("c","lips",cpu.lips[0]); setVar("c","shadow",cpu.shadow[0]); setVar("c","blush",cpu.blush[0]);
  setVar("c","dress",cpu.dress[0]); setVar("c","shoe",cpu.shoe[0]);
  setOutfit("c",cpu.style); setAcc("c",cpu.acc); setHair("c",cpu.hair);
  document.documentElement.style.setProperty("--c-hairc",cpu.hairc[0]);
  document.documentElement.style.setProperty("--c-glit",cpu.glit?1:0);
}

// ---------- runway sequence ----------
function flashes(n){                       // paparazzi camera flashes from the crowd
  const scr=$("screen-runway");
  for(let i=0;i<n;i++) setTimeout(()=>{
    if(!scr.classList.contains("on")) return;
    const f=document.createElement("div");
    f.className="flash";
    f.style.left=(4+Math.random()*18 + (Math.random()<.5?0:74))+"%";
    f.style.bottom=(2+Math.random()*20)+"%";
    scr.appendChild(f);
    setTimeout(()=>f.remove(),520);
  }, i*420+Math.random()*220);
}
async function runway(){
  show("screen-runway");
  cpuStyle();
  await walkDoll("#doll-z","Zoey");
  await walkDoll("#doll-c","Robo-Bella");
  results();
}
async function walkDoll(href,name){
  const box=$("walkerBox");
  $("walkerName").textContent=name;
  $("walkerUse").setAttribute("href",href);
  box.classList.add("snap");                     // jump to the back of the catwalk instantly
  box.classList.remove("near","pose","strut","visible");
  void box.offsetWidth;
  box.classList.remove("snap");
  box.classList.add("visible","strut");
  beat(8); flashes(9); box.classList.add("near");            // walk toward the camera, growing bigger
  await wait(3400);
  box.classList.remove("strut"); box.classList.add("pose");   // strike a pose up front
  applause(); flashes(5); if(name==="Zoey") say("Go Zoey, go!");
  await wait(1700);
  box.classList.remove("pose"); box.classList.add("strut");
  beat(6); flashes(6); box.classList.remove("near");         // turn and walk back, shrinking away
  await wait(2400);
  box.classList.remove("strut","visible");
  await wait(350);
}

// ---------- judging ----------
// ponytail: rigged scoring on purpose — Zoey wins ~78% and never scores under 7. She's five.
function makeScores(){
  const zoeyWins=Math.random()<.78;
  const z=[ri(7,10),ri(7,10),ri(8,10)];
  let c;
  if(zoeyWins){ c=z.map(s=>Math.max(2,s-ri(1,4))); }
  else{ c=z.map(s=>Math.min(10,s+1)); c[0]=Math.min(10,c[0]+1); } // close loss, never a blowout
  return {z,c,zoeyWins};
}
function compliments(){
  const pool=[];
  if(zoey.lips)   pool.push("I LOVE the "+zoey.lips[1]+" lips!");
  if(zoey.shadow) pool.push("That "+zoey.shadow[1]+" eyeshadow sparkles!");
  if(zoey.blush)  pool.push("Gorgeous "+zoey.blush[1]+" cheeks!");
  if(zoey.dress)  pool.push("That "+zoey.dress[1]+" dress is STUNNING!");
  if(zoey.shoe)   pool.push("Those "+zoey.shoe[1]+" shoes! Where can I get them?");
  if(zoey.acc==="tiara") pool.push("A tiara! A true princess!");
  if(zoey.acc==="bow")   pool.push("That bow is adorable!");
  if(zoey.acc==="earrings") pool.push("Those gold hoops! Gorgeous!");
  if(zoey.hairc) pool.push("The "+zoey.hairc[1]+" hair is EVERYTHING!");
  const hairLines={pigtails:"Pigtails! Adorable!",curly:"Those curls! Iconic!",bun:"That bun is pure elegance!"};
  if(hairLines[zoey.hair]) pool.push(hairLines[zoey.hair]);
  if(zoey.glit)   pool.push("SO much glitter. Fabulous!");
  while(pool.length<3) pool.push(rand(["Such natural beauty, darling!","What a superstar smile!","The walk! The confidence! Wow!"]));
  return pool.sort(()=>Math.random()-.5).slice(0,3);
}
const CPU_LINES=[
  "Hmm... interesting choice, Robo-Bella.",
  "Did a clown help you today, Bella?",
  "Beep boop... needs more practice!",
  "Oh my. Bold. Very bold.",
];
async function results(){
  show("screen-results");
  ["zc0","zc1","zc2","cc0","cc1","cc2"].forEach(id=>{ $(id).classList.remove("flip"); $(id).textContent=""; });
  $("ztot").classList.remove("show"); $("ctot").classList.remove("show");
  $("banner").classList.remove("show"); $("againBtn").style.visibility="hidden";
  $("bubble").textContent="The judges are ready...";
  say("Judges, what do we think of Zoey?");
  await wait(1800);

  const {z,c,zoeyWins}=makeScores();
  const nice=compliments();
  for(let i=0;i<3;i++){
    $("bubble").textContent=nice[i]; say(nice[i]);
    $("zc"+i).textContent=z[i]; $("zc"+i).classList.add("flip"); ding(900+i*150);
    await wait(2100);
  }
  $("ztot").textContent=z[0]+z[1]+z[2]; $("ztot").classList.add("show"); applause(1);
  await wait(1400);

  const cline=cpu.silly?CPU_LINES[ri(0,3)]:"Not bad, Robo-Bella... not bad.";
  $("bubble").textContent=cline; say(cline);
  for(let i=0;i<3;i++){ $("cc"+i).textContent=c[i]; $("cc"+i).classList.add("flip"); ding(500+i*100); await wait(700); }
  $("ctot").textContent=c[0]+c[1]+c[2]; $("ctot").classList.add("show");
  await wait(1200);

  if(zoeyWins){
    $("banner").textContent="ZOEY WINS!";
    $("banner").classList.add("show");
    fanfare(); applause(2.4); confetti();
    say("Zoey wins! What a superstar!");
  }else{
    $("banner").textContent="Sooo close!";
    $("banner").classList.add("show");
    say("Ooh, so close! One more walk, Zoey!");
  }
  $("againBtn").style.visibility="visible";
}

// ---------- confetti ----------
function confetti(){
  const layer=$("confetti"), colors=["#ff2d95","#ffd60a","#3a86ff","#8fe388","#9b5de5","#ff7f50"];
  for(let i=0;i<90;i++){
    const p=document.createElement("div");
    p.className="conf";
    p.style.left=Math.random()*100+"vw";
    p.style.background=rand(colors);
    p.style.animationDuration=(2.2+Math.random()*2)+"s";
    p.style.animationDelay=(Math.random()*1.2)+"s";
    layer.appendChild(p);
  }
  setTimeout(()=>layer.innerHTML="",5000);
}

// ---------- wiring ----------
$("startBtn").onclick=()=>{ ac(); ding(880); say("Welcome to Zoey's Runway!"); show("screen-studio"); };
$("runwayBtn").onclick=()=>{ ding(1000); runway(); };
$("againBtn").onclick=()=>{ ding(880); show("screen-studio"); };  // keeps her look so she can tweak it
buildSwatches();
buildClothes();
buildHair();
</script>
